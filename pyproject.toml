[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold-ml"
version = "0.3.0"
description = "Cost-sensitive, leakage-controlled fraud detection with calibrated, amount-aware decision policies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
threshold-ml = "threshold_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
